<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Darwin Acevedo">
    <title>Temporizador Pomodoro-proyecto21</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <h1>Temporizador Pomodoro</h1>

        <!-- Tipos de sesiones -->
        <nav class="opciones" aria-label="Tipos de sesión">

            <button class="opcion activa" data-modo="trabajo" aria-pressed="true">
                Pomodoro
            </button>

            <button class="opcion" data-modo="descansoCorto" aria-pressed="false">
                Descanso corto
            </button>

            <button class="opcion" data-modo="descansoLargo" aria-pressed="false">
                Descanso largo
            </button>

        </nav>

        <!-- Temporizador -->
        <section class="temporizador" aria-label="Temporizador">

            <h2 id="tipoSesion">Trabajo</h2>

            <div class="tiempo" id="tiempo" role="timer" aria-label="Tiempo restante">
                25:00
            </div>

            <!-- Botones de control -->
            <div class="botones">

                <button id="iniciarPausar" class="boton">
                    Iniciar
                </button>

                <button id="reiniciar" class="boton">
                    Reiniciar
                </button>

            </div>

            <!-- Contador de sesiones -->
            <p class="contador">
                Sesiones de trabajo:
                <span id="sesiones">0</span>
            </p>

            <p id="estado" class="estado" role="status" aria-live="polite">
            </p>

        </section>

        <!-- Configuración -->
        <section class="configuracion">

            <h2>Configuración (tiempos)</h2>

            <form id="formularioConfiguracion">

                <div class="grupo">

                    <label for="tiempoTrabajo">
                        Trabajo
                    </label>

                    <input type="number" id="tiempoTrabajo" min="1" max="180" value="25" required>

                </div>

                <div class="grupo">

                    <label for="tiempoDescansoCorto">
                        Descanso corto
                    </label>

                    <input type="number" id="tiempoDescansoCorto" min="1" max="180" value="5" required>

                </div>

                <div class="grupo">

                    <label for="tiempoDescansoLargo">
                        Descanso largo
                    </label>

                    <input type="number" id="tiempoDescansoLargo" min="1" max="180" value="15" required>

                </div>

                <button type="submit" class="boton guardar">
                    Guardar
                </button>

                <p id="mensajeConfiguracion" class="mensaje-configuracion" role="status" aria-live="polite">
                </p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
